services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: clever-ai-gate-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: clever_ai_gate
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway_secure_pass_2026
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./dbbackup:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d clever_ai_gate"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    command: >
      postgres
        -c shared_buffers=256MB
        -c max_connections=100
        -c work_mem=16MB

  redis:
    image: redis:7-alpine
    container_name: clever-ai-gate-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clever-ai-gate-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
